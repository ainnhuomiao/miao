version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # 往终端或 bytes.Buffer 打印的结果不检查；写文件的地方各自显式处理返回值。
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    # 不启用任何默认排除（对应 v1 的 exclude-use-default: false）
    presets: []
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # 0 表示不限，避免同类问题只报前 3 条导致漏报
  max-issues-per-linter: 0
  max-same-issues: 0
